<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Hosting | Plataforma de Bots Discord</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0a0a0f; }
        
        .gradient-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .gradient-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            backdrop-filter: blur(10px);
        }
        
        .glass-effect {
            background: rgba(15, 25, 35, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(102, 126, 234, 0.2);
        }
        
        .terminal {
            background: #0c0c0f;
            font-family: 'Fira Code', 'Courier New', monospace;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
        }
        
        .pulse-online {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }
        
        .status-badge {
            position: relative;
            padding-left: 20px;
        }
        
        .status-badge::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        
        .status-online::before { background: #10b981; box-shadow: 0 0 10px #10b981; animation: pulse 2s infinite; }
        .status-offline::before { background: #ef4444; }
        
        .modal {
            transition: all 0.3s ease;
        }
        
        .log-line {
            border-left: 3px solid #667eea;
            padding-left: 12px;
            margin: 4px 0;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 4px;
        }
        
        .resource-bar {
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="text-white">
    <!-- Navbar -->
    <nav class="glass-effect fixed top-0 left-0 right-0 z-50 border-b border-purple-500/20">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 gradient-primary rounded-xl flex items-center justify-center">
                        <i class="fas fa-robot text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">
                            Nexus Hosting
                        </h1>
                        <p class="text-xs text-gray-400">Plataforma Profissional de Bots</p>
                    </div>
                    <span class="ml-3 px-2 py-1 bg-green-500/20 text-green-400 text-xs rounded-full border border-green-500/30">
                        <i class="fas fa-circle text-[8px] mr-1 inline-block pulse-online"></i> LIVE
                    </span>
                </div>
                
                <button onclick="abrirModalDeploy()" class="btn-primary px-6 py-2 rounded-xl font-semibold flex items-center space-x-2">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>Novo Deploy</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 pt-24 pb-12">
        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="glass-effect rounded-2xl p-6 border border-purple-500/20">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-400 text-sm mb-1">Total de Bots</p>
                        <p class="text-3xl font-bold" id="totalBots">0</p>
                    </div>
                    <i class="fas fa-server text-4xl text-purple-500 opacity-50"></i>
                </div>
            </div>
            
            <div class="glass-effect rounded-2xl p-6 border border-purple-500/20">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-400 text-sm mb-1">Bots Online</p>
                        <p class="text-3xl font-bold text-green-400" id="botsOnline">0</p>
                    </div>
                    <i class="fas fa-circle text-3xl text-green-500 pulse-online"></i>
                </div>
            </div>
            
            <div class="glass-effect rounded-2xl p-6 border border-purple-500/20">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-400 text-sm mb-1">CPU Total</p>
                        <p class="text-3xl font-bold" id="cpuTotal">0%</p>
                    </div>
                    <i class="fas fa-microchip text-4xl text-blue-500 opacity-50"></i>
                </div>
            </div>
            
            <div class="glass-effect rounded-2xl p-6 border border-purple-500/20">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-400 text-sm mb-1">RAM Total</p>
                        <p class="text-3xl font-bold" id="ramTotal">0 MB</p>
                    </div>
                    <i class="fas fa-memory text-4xl text-red-500 opacity-50"></i>
                </div>
            </div>
        </div>

        <!-- Bots List -->
        <div class="glass-effect rounded-2xl border border-purple-500/20 overflow-hidden">
            <div class="px-6 py-4 border-b border-purple-500/20">
                <h2 class="text-xl font-bold flex items-center">
                    <i class="fas fa-robot mr-3 text-purple-500"></i>
                    Meus Bots
                </h2>
            </div>
            
            <div id="botsList" class="divide-y divide-purple-500/10">
                <!-- Loading -->
                <div class="p-12 text-center">
                    <i class="fas fa-spinner fa-spin text-4xl text-purple-500 mb-4"></i>
                    <p class="text-gray-400">Carregando seus bots...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Deploy -->
    <div id="deployModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 modal">
        <div class="glass-effect rounded-2xl w-full max-w-md mx-4 border border-purple-500/30">
            <div class="px-6 py-4 border-b border-purple-500/20 flex justify-between items-center">
                <h3 class="text-xl font-bold flex items-center">
                    <i class="fas fa-cloud-upload-alt mr-3 text-purple-500"></i>
                    Novo Deploy
                </h3>
                <button onclick="fecharModalDeploy()" class="text-gray-400 hover:text-white transition">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>
            
            <div class="p-6">
                <form id="deployForm" enctype="multipart/form-data">
                    <div class="mb-5">
                        <label class="block text-gray-300 mb-2 font-semibold">
                            <i class="fas fa-tag mr-2 text-purple-500"></i>
                            Nome do Bot
                        </label>
                        <input type="text" name="nome" required
                               class="w-full px-4 py-3 bg-black/50 border border-purple-500/30 rounded-xl text-white focus:outline-none focus:border-purple-500 transition"
                               placeholder="ex: meu-bot-incrivel">
                        <p class="text-gray-500 text-xs mt-1">Apenas letras, números, - e _</p>
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-gray-300 mb-2 font-semibold">
                            <i class="fas fa-file-archive mr-2 text-purple-500"></i>
                            Arquivo ZIP
                        </label>
                        <div class="border-2 border-dashed border-purple-500/30 rounded-xl p-6 text-center hover:border-purple-500 transition cursor-pointer" id="dropZone">
                            <i class="fas fa-cloud-upload-alt text-4xl text-purple-500 mb-2"></i>
                            <p class="text-gray-400">Clique ou arraste seu ZIP aqui</p>
                            <p class="text-gray-600 text-xs mt-1">Max 50MB</p>
                        </div>
                        <input type="file" name="arquivo" accept=".zip" required class="hidden" id="fileInput">
                    </div>
                    
                    <button type="submit" class="w-full btn-primary py-3 rounded-xl font-bold flex items-center justify-center space-x-2">
                        <i class="fas fa-rocket"></i>
                        <span>Fazer Deploy</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Console -->
    <div id="consoleModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 modal">
        <div class="glass-effect rounded-2xl w-full max-w-5xl max-h-[85vh] mx-4 flex flex-col border border-purple-500/30">
            <div class="px-6 py-4 border-b border-purple-500/20 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-terminal text-green-500 text-xl"></i>
                    <h3 class="text-xl font-bold">Console do Bot</h3>
                    <span id="consoleBotName" class="px-3 py-1 bg-purple-500/20 rounded-lg text-sm text-purple-400"></span>
                </div>
                <button onclick="fecharConsole()" class="text-gray-400 hover:text-white transition">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>
            
            <div class="flex-1 overflow-auto p-6 terminal" id="consoleContainer">
                <pre id="consoleOutput" class="text-green-400 text-sm font-mono whitespace-pre-wrap leading-relaxed"></pre>
            </div>
            
            <div class="px-6 py-3 border-t border-purple-500/20 flex justify-between">
                <button onclick="atualizarConsole()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition flex items-center space-x-2">
                    <i class="fas fa-sync-alt"></i>
                    <span>Atualizar</span>
                </button>
                <button onclick="limparDisplayConsole()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition flex items-center space-x-2">
                    <i class="fas fa-trash"></i>
                    <span>Limpar Tela</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentProjetoNome = null;
        let autoRefreshInterval = null;
        
        // Carregar bots
        async function carregarBots() {
            try {
                const response = await fetch('/api/projetos');
                const data = await response.json();
                const bots = data.projetos || [];
                
                const onlineBots = bots.filter(b => b.status === 'online').length;
                const totalCpu = bots.reduce((sum, b) => sum + (b.cpu || 0), 0);
                const totalRam = bots.reduce((sum, b) => sum + (b.mem || 0), 0);
                
                document.getElementById('totalBots').innerText = bots.length;
                document.getElementById('botsOnline').innerText = onlineBots;
                document.getElementById('cpuTotal').innerText = totalCpu.toFixed(1) + '%';
                document.getElementById('ramTotal').innerText = totalRam.toFixed(0) + ' MB';
                
                const container = document.getElementById('botsList');
                if (bots.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-16">
                            <i class="fas fa-inbox text-6xl text-gray-600 mb-4"></i>
                            <p class="text-gray-400 text-lg">Nenhum bot hospedado ainda</p>
                            <button onclick="abrirModalDeploy()" class="mt-6 btn-primary px-6 py-3 rounded-xl font-semibold inline-flex items-center space-x-2">
                                <i class="fas fa-plus"></i>
                                <span>Fazer primeiro deploy</span>
                            </button>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = bots.map(bot => `
                    <div class="p-6 hover:bg-white/5 transition group" id="bot-${bot.id.replace(/[^a-zA-Z0-9]/g, '_')}">
                        <div class="flex flex-wrap items-center justify-between gap-4">
                            <div class="flex items-center space-x-4">
                                <div class="w-12 h-12 gradient-primary rounded-xl flex items-center justify-center">
                                    <i class="fas fa-robot text-white text-xl"></i>
                                </div>
                                <div>
                                    <h3 class="text-lg font-bold">${bot.nome}</h3>
                                    <div class="flex items-center space-x-3 mt-1">
                                        <span class="status-badge ${bot.status === 'online' ? 'status-online' : 'status-offline'} text-sm">
                                            ${bot.status === 'online' ? 'ONLINE' : 'OFFLINE'}
                                        </span>
                                        <span class="text-gray-500 text-xs">
                                            <i class="far fa-calendar-alt mr-1"></i>${bot.criado}
                                        </span>
                                        <span class="text-gray-500 text-xs">
                                            <i class="fas fa-database mr-1"></i>${bot.tamanho} MB
                                        </span>
                                    </div>
                                </div>
                            </div>
                            
                            ${bot.status === 'online' ? `
                                <div class="flex items-center space-x-6">
                                    <div class="text-right">
                                        <div class="text-xs text-gray-400 mb-1">CPU</div>
                                        <div class="font-bold text-blue-400">${bot.cpu}%</div>
                                        <div class="w-20 h-1 bg-gray-700 rounded-full mt-1 overflow-hidden">
                                            <div class="resource-bar h-full rounded-full" style="width: ${Math.min(bot.cpu, 100)}%"></div>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-xs text-gray-400 mb-1">RAM</div>
                                        <div class="font-bold text-green-400">${bot.mem} MB</div>
                                        <div class="w-20 h-1 bg-gray-700 rounded-full mt-1 overflow-hidden">
                                            <div class="resource-bar h-full rounded-full" style="width: ${Math.min((bot.mem / 1024) * 100, 100)}%"></div>
                                        </div>
                                    </div>
                                </div>
                            ` : ''}
                            
                            <div class="flex space-x-2">
                                <button onclick="verConsole('${bot.nome}')" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition">
                                    <i class="fas fa-terminal mr-1"></i>Console
                                </button>
                                
                                ${bot.status === 'online' ? `
                                    <button onclick="reiniciarBot('${bot.nome}', ${bot.pid})" class="px-3 py-2 bg-yellow-600 hover:bg-yellow-700 rounded-lg transition">
                                        <i class="fas fa-sync-alt mr-1"></i>Reiniciar
                                    </button>
                                    <button onclick="pararBot(${bot.pid}, '${bot.nome}')" class="px-3 py-2 bg-red-600 hover:bg-red-700 rounded-lg transition">
                                        <i class="fas fa-stop mr-1"></i>Parar
                                    </button>
                                ` : `
                                    <button onclick="iniciarBot('${bot.nome}')" class="px-3 py-2 bg-green-600 hover:bg-green-700 rounded-lg transition">
                                        <i class="fas fa-play mr-1"></i>Iniciar
                                    </button>
                                `}
                            </div>
                        </div>
                    </div>
                `).join('');
                
                // Atualizar recursos dos bots online
                bots.forEach(bot => {
                    if (bot.status === 'online') {
                        setTimeout(() => atualizarRecursos(bot.nome), 1000);
                    }
                });
                
            } catch (error) {
                console.error('Erro:', error);
            }
        }
        
        async function atualizarRecursos(projetoNome) {
            try {
                const response = await fetch(`/api/recursos/${projetoNome}`);
                const data = await response.json();
                
                if (data.status === 'online') {
                    const botDiv = document.querySelector(`[id^="bot-${projetoNome.replace(/[^a-zA-Z0-9]/g, '_')}"]`);
                    if (botDiv) {
                        const statsDiv = botDiv.querySelector('.flex.items-center.space-x-6');
                        if (statsDiv) {
                            statsDiv.innerHTML = `
                                <div class="text-right">
                                    <div class="text-xs text-gray-400 mb-1">CPU</div>
                                    <div class="font-bold text-blue-400">${data.cpu}%</div>
                                    <div class="w-20 h-1 bg-gray-700 rounded-full mt-1 overflow-hidden">
                                        <div class="resource-bar h-full rounded-full" style="width: ${Math.min(data.cpu, 100)}%"></div>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="text-xs text-gray-400 mb-1">RAM</div>
                                    <div class="font-bold text-green-400">${data.mem} MB</div>
                                    <div class="w-20 h-1 bg-gray-700 rounded-full mt-1 overflow-hidden">
                                        <div class="resource-bar h-full rounded-full" style="width: ${Math.min((data.mem / 1024) * 100, 100)}%"></div>
                                    </div>
                                </div>
                            `;
                        }
                    }
                }
            } catch (error) {}
        }
        
        async function iniciarBot(projetoNome) {
            showNotification('🚀 Iniciando bot...', 'info');
            try {
                const response = await fetch('/api/iniciar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({projeto_nome: projetoNome})
                });
                
                const data = await response.json();
                if (data.success) {
                    showNotification('✅ Bot iniciado com sucesso!', 'success');
                    carregarBots();
                } else {
                    showNotification('❌ ' + data.error, 'error');
                }
            } catch (error) {
                showNotification('❌ Erro ao iniciar bot', 'error');
            }
        }
        
        async function pararBot(pid, projetoNome) {
            if (!confirm(`Tem certeza que deseja parar o bot "${projetoNome}"?`)) return;
            
            showNotification('🛑 Parando bot...', 'info');
            try {
                const response = await fetch('/api/parar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({pid: pid})
                });
                
                const data = await response.json();
                if (data.success) {
                    showNotification('✅ Bot parado com sucesso!', 'success');
                    carregarBots();
                } else {
                    showNotification('❌ ' + data.error, 'error');
                }
            } catch (error) {
                showNotification('❌ Erro ao parar bot', 'error');
            }
        }
        
        async function reiniciarBot(projetoNome, pid) {
            if (!confirm(`Reiniciar o bot "${projetoNome}"?`)) return;
            
            showNotification('🔄 Reiniciando bot...', 'info');
            try {
                const response = await fetch('/api/reiniciar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({projeto_nome: projetoNome, pid: pid})
                });
                
                const data = await response.json();
                if (data.success) {
                    showNotification('✅ Bot reiniciado com sucesso!', 'success');
                    setTimeout(() => carregarBots(), 2000);
                } else {
                    showNotification('❌ ' + data.error, 'error');
                }
            } catch (error) {
                showNotification('❌ Erro ao reiniciar bot', 'error');
            }
        }
        
        async function verConsole(projetoNome) {
            currentProjetoNome = projetoNome;
            document.getElementById('consoleBotName').innerText = projetoNome;
            document.getElementById('consoleModal').classList.remove('hidden');
            document.getElementById('consoleModal').classList.add('flex');
            await atualizarConsole();
            
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(atualizarConsole, 3000);
        }
        
        async function atualizarConsole() {
            if (!currentProjetoNome) return;
            
            try {
                const response = await fetch(`/api/logs/${currentProjetoNome}`);
                const data = await response.json();
                
                const container = document.getElementById('consoleOutput');
                if (data.logs) {
                    container.innerText = data.logs;
                    container.scrollTop = container.scrollHeight;
                } else if (data.error) {
                    container.innerText = '❌ ' + data.error;
                }
            } catch (error) {
                document.getElementById('consoleOutput').innerText = '❌ Erro ao carregar logs';
            }
        }
        
        function limparDisplayConsole() {
            document.getElementById('consoleOutput').innerText = '';
        }
        
        function fecharConsole() {
            document.getElementById('consoleModal').classList.add('hidden');
            document.getElementById('consoleModal').classList.remove('flex');
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
            currentProjetoNome = null;
        }
        
        function abrirModalDeploy() {
            document.getElementById('deployModal').classList.remove('hidden');
            document.getElementById('deployModal').classList.add('flex');
        }
        
        function fecharModalDeploy() {
            document.getElementById('deployModal').classList.add('hidden');
            document.getElementById('deployModal').classList.remove('flex');
        }
        
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `fixed bottom-4 right-4 px-5 py-3 rounded-xl shadow-2xl z-50 animate-bounce flex items-center space-x-2 ${
                type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600'
            } text-white`;
            notification.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i><span>${message}</span>`;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 5000);
        }
        
        // Deploy form
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-purple-500', 'bg-purple-500/10');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-purple-500', 'bg-purple-500/10');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-purple-500', 'bg-purple-500/10');
            const files = e.dataTransfer.files;
            if (files.length > 0) fileInput.files = files;
        });
        
        document.getElementById('deployForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            showNotification('📦 Enviando arquivo...', 'info');
            
            try {
                const response = await fetch('/api/deploy', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if (data.success) {
                    showNotification(`✅ Deploy realizado! Bot: ${data.projeto} (${data.tamanho.toFixed(2)} MB)`, 'success');
                    fecharModalDeploy();
                    carregarBots();
                    e.target.reset();
                } else {
                    showNotification('❌ ' + data.error, 'error');
                }
            } catch (error) {
                showNotification('❌ Erro ao fazer deploy', 'error');
            }
        });
        
        // Socket events
        socket.on('connect', () => console.log('✅ Conectado ao servidor'));
        socket.on('bot_iniciado', (data) => {
            showNotification(`🚀 Bot "${data.projeto}" iniciado!`, 'success');
            carregarBots();
        });
        socket.on('bot_parado', (data) => {
            showNotification(`🛑 Bot parado`, 'info');
            carregarBots();
        });
        
        // Auto refresh
        setInterval(carregarBots, 8000);
        carregarBots();
        
        // ESC to close modals
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                fecharModalDeploy();
                fecharConsole();
            }
        });
    </script>
</body>
</html>
