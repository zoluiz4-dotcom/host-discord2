services:
  - type: web
    name: bot-panel-backend
    runtime: python
    plan: starter
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PANEL_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BOTS_DIR
        value: ./bots_data
      - key: DATABASE_URL
        value: sqlite:///./panel.db
      - key: USE_DOCKER
        value: "false"
      - key: PYTHON_VERSION
        value: 3.12.10
