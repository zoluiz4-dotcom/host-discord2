services:
  - type: web
    name: discord-bot-hosting
    runtime: python
    repo: https://github.com/seu-usuario/discord-bot-hosting
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
    
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    
    startCommand: gunicorn -k eventlet -w 1 app:app
    
    healthCheckPath: /
    
    autoDeploy: true
    
    domains:
      - discord-hosting.onrender.com
    
    region: oregon
    
    scaling:
      minInstances: 1
      maxInstances: 1
    
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
